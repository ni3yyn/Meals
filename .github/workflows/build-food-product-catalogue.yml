name: Build unified food product catalogue

on:
  push:
    branches: [main]
    paths:
      - "data/recipes/ar/recipes.json"
      - "data/products/categories.json"
      - "data/products/catalogue-baseline.json"
      - "data/products/taxonomy.schema.json"
      - "data/products/curated-food-items.json"
      - "data/products/translations.json"
      - "tools/build_food_product_catalogue.py"
      - "tools/test_food_product_catalogue.py"
      - "tools/translate_food_catalogue.py"
      - "tools/test_translate_food_catalogue.py"
      - "tools/validate_food_taxonomy.py"
      - ".github/workflows/build-food-product-catalogue.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-food-product-catalogue
  cancel-in-progress: false

jobs:
  build:
    name: Match recipes and build canonical food items
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIDATI_DATA_CACHE: .cache/product-catalogue
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pinned source datasets
        uses: actions/cache@v6
        with:
          path: .cache/product-catalogue
          key: midati-food-sources-off-f5abb0a0ca8ae5702f3e192219511adf211b55ee-foodon-8a27493346a122e86ac1748aac24199d5af69166

      - name: Run catalogue parser and matching tests
        run: python -m unittest tools.test_food_product_catalogue tools.test_translate_food_catalogue -v

      - name: Build catalogue, legacy-ID crosswalk and audit
        run: python tools/build_food_product_catalogue.py

      - name: Validate canonical taxonomy, catalogue identities and recipe compatibility
        run: python tools/validate_food_taxonomy.py

      - name: Commit generated catalogue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/products/catalogue.json \
                  data/products/recipe-ingredient-map.json \
                  data/products/build-audit.json \
                  data/products/identity_registry.json
          if git diff --cached --quiet; then
            echo "Generated catalogue is already up to date."
            exit 0
          fi
          git commit -m "Build unified food product catalogue"

          git fetch origin main
          # Do not publish output generated from stale inputs. Validate every file
          # that affects matching, translations, categories or generated schema.
          input_paths=(
            "data/recipes/ar/recipes.json"
            "data/products/categories.json"
            "data/products/catalogue-baseline.json"
            "data/products/taxonomy.schema.json"
            "data/products/curated-food-items.json"
            "data/products/translations.json"
            ".github/apps-script/recipe_translation_api.gs"
            "tools/build_food_product_catalogue.py"
            "tools/test_food_product_catalogue.py"
            "tools/validate_food_taxonomy.py"
            ".github/workflows/build-food-product-catalogue.yml"
          )
          for path in "${input_paths[@]}"; do
            if [[ "$(git rev-parse "HEAD:$path")" != "$(git rev-parse "origin/main:$path")" ]]; then
              echo "::error::Input '$path' changed during this build. Rerun against the newest main revision."
              exit 1
            fi
          done

          # Rebase only the generated data changes. A normal git rebase can
          # conflict when another serialized build has already published these
          # JSON outputs, even when all source inputs are identical.
          git reset --mixed origin/main
          git add data/products/catalogue.json \
                  data/products/recipe-ingredient-map.json \
                  data/products/build-audit.json \
                  data/products/identity_registry.json
          if git diff --cached --quiet; then
            echo "The latest main branch already contains these generated catalogue files."
            exit 0
          fi
          git commit -m "Build unified food product catalogue"
          git push origin HEAD:main
