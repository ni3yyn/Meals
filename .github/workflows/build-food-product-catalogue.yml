name: Build unified food product catalogue

on:
  push:
    branches: [main]
    paths:
      - "data/recipes/ar/recipes.json"
      - "data/products/categories.json"
      - "data/products/curated-food-items.json"
      - "tools/build_food_product_catalogue.py"
      - "tools/test_food_product_catalogue.py"
      - ".github/workflows/build-food-product-catalogue.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-food-product-catalogue
  cancel-in-progress: false

jobs:
  build:
    name: Match recipes and build canonical food items
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIDATI_DATA_CACHE: .cache/product-catalogue
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pinned source datasets
        uses: actions/cache@v6
        with:
          path: .cache/product-catalogue
          key: midati-food-sources-off-f5abb0a0ca8ae5702f3e192219511adf211b55ee-foodon-8a27493346a122e86ac1748aac24199d5af69166

      - name: Run catalogue parser and matching tests
        run: python -m unittest tools.test_food_product_catalogue -v

      - name: Build catalogue, legacy-ID crosswalk and audit
        run: python tools/build_food_product_catalogue.py

      - name: Validate generated catalogue and complete recipe links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          catalogue = json.loads(Path("data/products/catalogue.json").read_text(encoding="utf-8"))
          mapping = json.loads(Path("data/products/recipe-ingredient-map.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("data/products/build-audit.json").read_text(encoding="utf-8"))
          category_data = json.loads(Path("data/products/categories.json").read_text(encoding="utf-8"))
          identity_registry = json.loads(Path("data/products/identity_registry.json").read_text(encoding="utf-8"))
          products = catalogue.get("products") or []
          categories = category_data.get("categories") or []
          category_ids = {item.get("id") for item in categories}
          subcategory_parent = {
              child.get("id"): item.get("id")
              for item in categories
              for child in item.get("subcategories", [])
          }
          ids = [item.get("id") for item in products]
          english = [
              " ".join(str(item.get("names", {}).get("en") or "").casefold().split())
              for item in products
              if item.get("names", {}).get("en")
          ]
          links = mapping.get("recipeIngredientToProductId") or {}
          if not products or len(ids) != len(set(ids)):
              raise SystemExit("Product catalogue is empty or contains duplicate IDs.")
          if catalogue.get("idFormat") != "UUIDv4" or any(
              not isinstance(item_id, str) or len(item_id) != 36
              or item_id[14] != "4" or item_id[19] not in "89ab"
              for item_id in ids
          ):
              raise SystemExit("Every food item must have an opaque UUIDv4 ID.")
          registry_ids = set((identity_registry.get("ids") or {}).values())
          if not set(ids).issubset(registry_ids):
              raise SystemExit("Persistent registry is missing one or more published food-item IDs.")
          if len(english) != len(set(english)):
              raise SystemExit("Product catalogue contains duplicate normalized English names.")
          if not links:
              raise SystemExit("No recipe ingredient mappings were generated.")
          if any(target not in set(ids) for target in links.values()):
              raise SystemExit("A recipe ingredient mapping points to a missing product ID.")
          for product in products:
              if product.get("categoryId") not in category_ids:
                  raise SystemExit(f"Invalid category ID on product {product.get('id')}.")
              subcategory_id = product.get("subcategoryId")
              if subcategory_id is not None and subcategory_parent.get(subcategory_id) != product.get("categoryId"):
                  raise SystemExit(f"Invalid subcategory relationship on product {product.get('id')}.")
          counts = audit.get("catalogueCounts") or {}
          if counts.get("mappedRecipeIngredientIds") != len(links):
              raise SystemExit("Audit mapping count does not match the mapping file.")
          if counts.get("duplicateIds") != 0 or counts.get("duplicateEnglishNames") != 0:
              raise SystemExit("Duplicate validation failed.")
          if counts.get("uuidv4Ids") != len(products):
              raise SystemExit("Audit confirms a missing or invalid UUIDv4 ID.")
          recipe_rows = mapping.get("recipeRows") or []
          if counts.get("recipeRowsMapped") != len(recipe_rows):
              raise SystemExit("Recipe row audit does not match the crosswalk.")
          for row in recipe_rows:
              if links.get(row.get("legacyRoomIngredientId")) != row.get("foodItemId"):
                  raise SystemExit("A recipe row does not resolve through the legacy-ID map.")
          recipe_rows = mapping.get("recipeRows") or []
          row_ids = {
              (row.get("recipeId"), row.get("ingredientIndex"))
              for row in recipe_rows
          }
          if len(row_ids) != len(recipe_rows):
              raise SystemExit("Duplicate recipe-row mappings were generated.")
          print(f"Validated {len(products)} unique food items, {len(links)} legacy ingredient IDs and {len(recipe_rows)} recipe rows.")
          PY

      - name: Commit generated catalogue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/products/catalogue.json \
                  data/products/recipe-ingredient-map.json \
                  data/products/build-audit.json \
                  data/products/identity_registry.json
          if git diff --cached --quiet; then
            echo "Generated catalogue is already up to date."
            exit 0
          fi
          git commit -m "Build unified food product catalogue"

          git fetch origin main
          if [[ "$(git rev-parse HEAD:data/recipes/ar/recipes.json)" != "$(git rev-parse origin/main:data/recipes/ar/recipes.json)" ]]; then
            echo "::error::The recipe catalogue changed during this build. Rerun the workflow against the newest recipe revision."
            exit 1
          fi
          git rebase origin/main
          git push origin HEAD:main
