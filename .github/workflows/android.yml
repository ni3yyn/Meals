name: Android CI

# Temporarily paused on push and pull requests while the signed release pipeline
# is the single source of Android build validation. Manual runs remain available.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-read-only: false

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.1" "build-tools;36.0.0" "platform-tools"

      - name: Run unit tests
        run: gradle testReleaseUnitTest --no-daemon --build-cache --parallel

      - name: Launch minified release build on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedReleaseAndroidTest --no-daemon --build-cache --parallel

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --build-cache --parallel

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: meals-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
