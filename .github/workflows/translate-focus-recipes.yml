name: Import Focus recipes into the Arabic catalogue

on:
  push:
    branches: [main]
    paths:
      - "tools/translate_focus_recipe_corpus.py"
      - "tools/test_focus_recipe_pipeline.py"
      - ".github/apps-script/recipe_translation_api.gs"
      - ".github/workflows/translate-focus-recipes.yml"
  workflow_dispatch:
    inputs:
      max_recipes:
        description: Maximum Focus recipes to translate in this run
        required: true
        default: "500"
        type: string

permissions:
  contents: write

concurrency:
  group: translate-focus-recipes-ar
  cancel-in-progress: false

jobs:
  import:
    name: Screen, translate and merge Focus recipes
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
      GOOGLE_APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
      MAX_RECIPES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_recipes || '500' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate safety rules and ingredient parsing
        run: python -m unittest tools.test_focus_recipe_pipeline -v

      - name: Check translation credentials
        id: credentials
        shell: bash
        run: |
          if [[ -z "$GOOGLE_APPS_SCRIPT_URL" || -z "$GOOGLE_APPS_SCRIPT_TOKEN" ]]; then
            echo "::error::The existing GOOGLE_APPS_SCRIPT_URL and GOOGLE_APPS_SCRIPT_TOKEN secrets are required."
            exit 1
          fi
          if [[ ! "$GOOGLE_APPS_SCRIPT_URL" =~ ^https://script\.google\.com/macros/s/.+/exec$ ]]; then
            echo "::error::GOOGLE_APPS_SCRIPT_URL must be the deployed Apps Script /exec URL."
            exit 1
          fi

      - name: Screen and translate Focus recipes into Arabic
        id: translate
        run: |
          python tools/translate_focus_recipe_corpus.py \
            --max-recipes "$MAX_RECIPES" \
            --batch-size 10

      - name: Save resumable Focus translation checkpoint
        if: always() && steps.credentials.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          CATALOGUE="data/recipes/ar/recipes.json"
          if [[ ! -f "$CATALOGUE" ]]; then
            echo "No translation output was created."
            exit 0
          fi

          IS_COMPLETE="$(python - "$CATALOGUE" <<'PY'
          import json
          import pathlib
          import sys

          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("true" if value.get("complete") is True and value.get("translatedCount") == value.get("expectedCount") else "false")
          PY
          )"
          if [[ "$IS_COMPLETE" == "true" ]]; then
            echo "Translation completed; the following step will publish and pin the full catalogue."
            exit 0
          fi

          if git diff --quiet -- "$CATALOGUE"; then
            echo "No resumable catalogue changes to save."
            exit 0
          fi
          git add "$CATALOGUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Checkpoint Focus Arabic recipe translations"
          git push origin HEAD:main

      - name: Commit merged catalogue and pin the Android download
        if: success() && steps.translate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          CATALOGUE="data/recipes/ar/recipes.json"
          DOWNLOADER="app/src/main/java/dz/meals/app/data/ArabicRecipeCatalogueDownloader.kt"

          git add "$CATALOGUE"
          python - "$CATALOGUE" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          value = json.loads(path.read_text(encoding="utf-8"))
          if value.get("complete") is not True:
              raise SystemExit("Refusing to publish an incomplete Arabic catalogue.")
          if value.get("translatedCount") != value.get("expectedCount"):
              raise SystemExit("Catalogue translatedCount does not match expectedCount.")
          ids = [recipe.get("id") for recipe in value.get("recipes", [])]
          if len(ids) != len(set(ids)):
              raise SystemExit("Catalogue contains duplicate recipe IDs.")
          if not any(str(recipe_id).startswith("focus:") for recipe_id in ids):
              raise SystemExit("No Focus recipes were added to the catalogue.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Add safe Arabic Focus recipe corpus"
          else
            echo "The complete catalogue is already committed; checking downloader pin."
          fi

          # Pin Android to the exact commit that contains the catalogue blob.
          DATA_REVISION="$(git rev-parse HEAD)"
          python - "$CATALOGUE" "$DOWNLOADER" "$DATA_REVISION" <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import sys

          catalogue_path = pathlib.Path(sys.argv[1])
          downloader_path = pathlib.Path(sys.argv[2])
          revision = sys.argv[3]
          catalogue = json.loads(catalogue_path.read_text(encoding="utf-8"))
          expected_count = int(catalogue["expectedCount"])
          expected_bytes = catalogue_path.stat().st_size
          expected_blob_sha = subprocess.check_output(
              ["git", "hash-object", str(catalogue_path)], text=True
          ).strip()

          source = downloader_path.read_text(encoding="utf-8")
          replacements = {
              r'const val REVISION = "[^"]+"': f'const val REVISION = "{revision}"',
              r'const val EXPECTED_RECIPE_COUNT = \d+': f'const val EXPECTED_RECIPE_COUNT = {expected_count}',
              r'const val EXPECTED_BYTES = [0-9_]+L': f'const val EXPECTED_BYTES = {expected_bytes:_}L',
              r'const val EXPECTED_GIT_BLOB_SHA = "[^"]+"': f'const val EXPECTED_GIT_BLOB_SHA = "{expected_blob_sha}"',
          }
          for pattern, replacement in replacements.items():
              updated, count = re.subn(pattern, replacement, source)
              if count != 1:
                  raise SystemExit(f"Expected exactly one downloader constant for: {pattern}")
              source = updated
          downloader_path.write_text(source, encoding="utf-8")
          print(
              f"Pinned catalogue revision {revision}; {expected_count} recipes; "
              f"{expected_bytes:,} bytes; Git blob {expected_blob_sha}."
          )
          PY

          git add "$DOWNLOADER"
          if git diff --cached --quiet; then
            echo "Android downloader is already pinned to the complete catalogue."
            exit 0
          fi
          git commit -m "Pin expanded Arabic recipe catalogue download"
          git push origin HEAD:main
