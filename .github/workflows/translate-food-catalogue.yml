name: Translate generic food catalogue names

on:
  workflow_dispatch:
    inputs:
      max_translations:
        description: Maximum missing language names to translate in this run
        required: true
        default: "6000"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/translate-food-catalogue.yml"
      - "tools/build_food_product_catalogue.py"
      - "tools/translate_food_catalogue.py"
      - "tools/test_food_product_catalogue.py"
      - "tools/test_translate_food_catalogue.py"
      - "data/recipes/ar/recipes.json"
      - "data/products/categories.json"
      - "data/products/curated-food-items.json"
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: write

concurrency:
  group: build-food-product-catalogue
  cancel-in-progress: false

jobs:
  translate:
    name: Translate missing food names and checkpoint progress
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
      GOOGLE_APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
      MAX_TRANSLATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_translations || '6000' }}
      MIDATI_DATA_CACHE: .cache/product-catalogue
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pinned taxonomy sources
        uses: actions/cache@v6
        with:
          path: .cache/product-catalogue
          key: midati-food-sources-off-f5abb0a0ca8ae5702f3e192219511adf211b55ee-foodon-8a27493346a122e86ac1748aac24199d5af69166

      - name: Verify existing Apps Script credentials
        shell: bash
        run: |
          if [[ -z "$GOOGLE_APPS_SCRIPT_URL" || -z "$GOOGLE_APPS_SCRIPT_TOKEN" ]]; then
            echo "::error::Add the existing GOOGLE_APPS_SCRIPT_URL and GOOGLE_APPS_SCRIPT_TOKEN repository secrets."
            exit 1
          fi

      - name: Run catalogue and translation tests
        run: python -m unittest tools.test_food_product_catalogue tools.test_translate_food_catalogue -v

      - name: Build source-backed catalogue
        run: python tools/build_food_product_catalogue.py

      - name: Translate missing food names through Apps Script
        run: python tools/translate_food_catalogue.py --max-translations "$MAX_TRANSLATIONS" --batch-size 20 --languages ar,fr,en

      - name: Rebuild catalogue with checkpointed translations
        id: rebuild
        if: always()
        run: python tools/build_food_product_catalogue.py

      - name: Validate translated catalogue and UUID bindings
        id: validate
        if: always() && steps.rebuild.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalogue = json.loads(Path("data/products/catalogue.json").read_text(encoding="utf-8"))
          sidecar = json.loads(Path("data/products/translations.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("data/products/build-audit.json").read_text(encoding="utf-8"))
          products = catalogue.get("products") or []
          ids = [item.get("id") for item in products]
          if not products or len(ids) != len(set(ids)):
              raise SystemExit("Food catalogue is empty or contains duplicate IDs.")
          if any(not isinstance(item, str) or len(item) != 36 or item[14] != "4" or item[19] not in "89ab" for item in ids):
              raise SystemExit("Food catalogue contains a non-UUIDv4 ID.")
          known_ids = set(ids)
          unknown_translation_ids = set(sidecar.get("translations", {})) - known_ids
          if unknown_translation_ids:
              raise SystemExit("Translation sidecar contains UUIDs absent from the current catalogue.")
          counts = audit.get("catalogueCounts") or {}
          for language, key in (("ar", "missingArabicNames"), ("en", "missingEnglishNames"), ("fr", "missingFrenchNames")):
              actual_missing = sum(1 for item in products if not str((item.get("names") or {}).get(language) or "").strip())
              if actual_missing != counts.get(key):
                  raise SystemExit(f"Translation audit mismatch for {language}: {actual_missing} vs {counts.get(key)}.")
          machine = audit.get("machineNameTranslations") or {}
          providers = set(machine.get("providers") or [])
          if not providers:
              # Backward compatibility with audits produced before the provider
              # list was added. Mixed sources were historically joined with "+".
              providers = {
                  provider.strip()
                  for provider in str(machine.get("provider") or "").split("+")
                  if provider.strip()
              }
          if "Google Apps Script LanguageApp" not in providers:
              raise SystemExit(
                  "Catalogue audit does not list Google Apps Script LanguageApp "
                  "among its translation providers."
              )
          print(f"Validated {len(products)} stable food IDs; {sidecar.get('translationCount', 0)} saved translations; missing ar/en/fr: {counts.get('missingArabicNames')}/{counts.get('missingEnglishNames')}/{counts.get('missingFrenchNames')}.")
          PY

      - name: Commit saved translations and rebuilt catalogue
        if: always() && steps.rebuild.outcome == 'success' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/products/translations.json data/products/catalogue.json data/products/build-audit.json data/products/identity_registry.json
          if git diff --cached --quiet; then
            echo "No translation or catalogue changes to commit."
            exit 0
          fi
          git commit -m "Translate food names with Google Apps Script"

          git fetch origin main
          # Ensure the translation sidecar has not been edited on main since
          # this run checked it out; the committed sidecar is a generated output.
          if [[ "$(git rev-parse "HEAD^:data/products/translations.json")" != "$(git rev-parse "origin/main:data/products/translations.json")" ]]; then
            echo "::error::The food translation sidecar changed during this run. Re-run against the newest main revision."
            exit 1
          fi
          input_paths=(
            "data/recipes/ar/recipes.json"
            "data/products/categories.json"
            "data/products/curated-food-items.json"
            "tools/build_food_product_catalogue.py"
            "tools/test_food_product_catalogue.py"
            "tools/translate_food_catalogue.py"
            "tools/test_translate_food_catalogue.py"
            ".github/apps-script/recipe_translation_api.gs"
            ".github/workflows/build-food-product-catalogue.yml"
            ".github/workflows/translate-food-catalogue.yml"
          )
          for path in "${input_paths[@]}"; do
            if [[ "$(git rev-parse "HEAD:$path")" != "$(git rev-parse "origin/main:$path")" ]]; then
              echo "::error::Input '$path' changed during translation. Re-run against the newest main revision."
              exit 1
            fi
          done

          git reset --mixed origin/main
          git add data/products/translations.json data/products/catalogue.json data/products/build-audit.json data/products/identity_registry.json
          if git diff --cached --quiet; then
            echo "The latest main already contains these translation outputs."
            exit 0
          fi
          git commit -m "Translate food names with Google Apps Script"
          git push origin HEAD:main
