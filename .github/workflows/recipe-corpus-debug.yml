name: Temporary Recipe Corpus Debug Build

on:
  push:
    branches:
      - tmp/recipe-corpus-debug-test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipe-corpus-debug-test
  cancel-in-progress: true

jobs:
  build:
    name: Download corpus and build tester APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.1" "build-tools;36.0.0" "platform-tools"

      - name: Download and verify pinned recipe corpus
        run: python tools/download_recipe_corpus.py

      - name: Run unit tests and assemble debug APK
        run: ./gradlew testReleaseUnitTest assembleDebug --stacktrace

      - name: Upload corpus-enabled debug APK
        uses: actions/upload-artifact@v7
        with:
          name: midati-recipe-corpus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
