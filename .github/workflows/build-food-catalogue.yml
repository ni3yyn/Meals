name: Build generic food catalogue

on:
  push:
    branches: [main]
    paths:
      - "tools/build_food_catalogue.py"
      - "tools/test_food_catalogue_pipeline.py"
      - "data/catalogues/source-lock.json"
      - "data/catalogues/curated-food-items.json"
      - "data/recipes/ar/recipes.json"
      - ".github/workflows/build-food-catalogue.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: midati-generic-food-catalogue
  cancel-in-progress: false

jobs:
  build:
    name: Download, match, deduplicate and publish food catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test catalogue parser and matching rules
        run: python -m unittest tools.test_food_catalogue_pipeline -v

      - name: Build catalogue from pinned sources
        run: |
          python tools/build_food_catalogue.py \
            --recipes data/recipes/ar/recipes.json \
            --output-dir data/catalogues

      - name: Validate and publish generated catalogue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          base = pathlib.Path("data/catalogues")
          items = json.loads((base / "food-items.json").read_text(encoding="utf-8"))["items"]
          categories = json.loads((base / "categories.json").read_text(encoding="utf-8"))["categories"]
          mapping = json.loads((base / "recipe-ingredient-map.json").read_text(encoding="utf-8"))["rows"]
          report = json.loads((base / "food-catalogue-report.json").read_text(encoding="utf-8"))
          ids = {item["id"] for item in items}
          category_ids = {item["id"] for item in categories}
          assert len(ids) == len(items), "Duplicate food UUIDs"
          assert len({(item.get("names") or {}).get("en", "").casefold() for item in items}) == len(items), "Duplicate canonical English names"
          assert all(item["categoryId"] in category_ids for item in items), "Unknown category ID"
          assert all(not item.get("subcategoryId") or item["subcategoryId"] in category_ids for item in items), "Unknown subcategory ID"
          assert report["foodItemCount"] == len(items), "Food item count mismatch"
          assert report["recipeRowsFullyMapped"] == len(mapping), "Recipe mapping report mismatch"
          assert all(row["foodItemId"] in ids for row in mapping), "Dangling recipe food ID"
          print(f"Validated {len(items)} food items and {len(mapping)} recipe ingredient links.")
          PY

          git add \
            data/catalogues/food-items.json \
            data/catalogues/categories.json \
            data/catalogues/recipe-ingredient-map.json \
            data/catalogues/food-catalogue-report.json \
            data/catalogues/food-item-id-registry.json
          if git diff --cached --quiet; then
            echo "Generated catalogue is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build unified generic food catalogue"
          git push origin HEAD:main
