name: Room food identity migration

on:
  pull_request:
    paths:
      - "app/src/main/java/dz/meals/app/data/**"
      - "app/src/main/java/dz/meals/app/data/local/**"
      - "app/src/test/java/dz/meals/app/data/**"
      - "app/build.gradle.kts"
      - "data/products/recipe-ingredient-map.json"
      - "data/products/categories.json"
      - ".github/workflows/room-migration.yml"
  push:
    branches:
      - main
    paths:
      - "app/src/main/java/dz/meals/app/data/**"
      - "app/src/main/java/dz/meals/app/data/local/**"
      - "app/src/test/java/dz/meals/app/data/**"
      - "app/build.gradle.kts"
      - "data/products/recipe-ingredient-map.json"
      - "data/products/categories.json"
      - ".github/workflows/room-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: room-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    name: Migrate a real v13 SQLite database (Robolectric)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run Room migration and unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace --no-daemon
