name: Room food identity migration

on:
  pull_request:
    paths:
      - "app/src/main/java/dz/meals/app/data/**"
      - "app/src/main/java/dz/meals/app/data/local/**"
      - "app/src/androidTest/java/dz/meals/app/data/local/**"
      - "app/build.gradle.kts"
      - "data/products/recipe-ingredient-map.json"
      - ".github/workflows/room-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    name: Migrate a real v13 SQLite database on Android
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build release and instrumentation-test variants
        run: ./gradlew :app:testReleaseUnitTest :app:assembleReleaseAndroidTest --stacktrace

      # GitHub-hosted Ubuntu runners expose /dev/kvm but it is not always
      # readable by the runner user. Apply the documented udev rule before
      # the emulator action probes for acceleration. If KVM is unavailable,
      # explicitly opt into the emulator's supported TCG fallback (required
      # by recent emulator releases when -accel off is passed).
      - name: Enable KVM or configure supported software fallback
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM is available to the runner; hardware acceleration will be used."
            ls -l /dev/kvm
          else
            echo "::warning::KVM is unavailable or inaccessible. Using the Android emulator's supported TCG fallback."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi

      - name: Run Room migration instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_atd
          emulator-boot-timeout: 900
          disable-linux-hw-accel: auto
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedReleaseAndroidTest --stacktrace

      - name: Collect emulator diagnostics
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/room-migration-emulator-diagnostics"
          mkdir -p "$OUT"

          {
            echo "=== Runner ==="
            uname -a
            echo "=== KVM ==="
            ls -l /dev/kvm 2>&1 || true
            echo "=== Emulator version ==="
            "$ANDROID_HOME/emulator/emulator" -version 2>&1 || true
            echo "=== ADB devices ==="
            adb devices -l 2>&1 || true
            echo "=== Emulator processes ==="
            ps aux | grep -E '[e]mulator|[q]emu' || true
            echo "=== AVD files ==="
            find "$HOME/.android/avd" -maxdepth 3 -type f -print 2>&1 || true
          } > "$OUT/summary.txt"

          adb -s emulator-5554 logcat -d -t 4000 > "$OUT/logcat.txt" 2>&1 || true
          find "$HOME/.android/avd" -type f \( -name '*.log' -o -name 'config.ini' \) -exec cp --parents {} "$OUT" \; 2>/dev/null || true

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-migration-emulator-diagnostics
          path: ${{ runner.temp }}/room-migration-emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 7
