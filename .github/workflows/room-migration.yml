name: Room food identity migration

on:
  pull_request:
    paths:
      - "app/src/main/java/dz/meals/app/data/**"
      - "app/src/main/java/dz/meals/app/data/local/**"
      - "app/src/androidTest/java/dz/meals/app/data/local/**"
      - "app/build.gradle.kts"
      - "data/products/recipe-ingredient-map.json"
      - ".github/workflows/room-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: room-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    name: Migrate a real v13 SQLite database on Android
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build release and instrumentation-test variants
        run: ./gradlew :app:testReleaseUnitTest :app:assembleReleaseAndroidTest --stacktrace

      # GitHub-hosted Linux runners may expose KVM but require an explicit udev
      # rule before the emulator process can access /dev/kvm.
      - name: Enable and verify KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          if [[ ! -c /dev/kvm ]]; then
            echo "::error::This runner does not expose the KVM device. Use a GitHub-hosted runner with hardware virtualization enabled."
            exit 1
          fi

          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run Room migration instrumentation test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: |
            "$ANDROID_HOME/emulator/emulator" -accel-check
          script: ./gradlew :app:connectedReleaseAndroidTest --stacktrace

      - name: Collect emulator diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p build/emulator-diagnostics
          {
            echo "=== Runner ==="
            uname -a
            echo "=== CPU virtualization flags ==="
            grep -m 1 -E 'flags|Features' /proc/cpuinfo || true
            echo "=== KVM device ==="
            ls -l /dev/kvm || true
            echo "=== Emulator acceleration check ==="
            "$ANDROID_HOME/emulator/emulator" -accel-check || true
            echo "=== Emulator and ADB processes ==="
            ps -ef | grep -E '[e]mulator|[a]db' || true
            echo "=== ADB devices ==="
            adb devices -l || true
            echo "=== Recent emulator logcat ==="
            adb -s emulator-5554 logcat -b all -d -t 2000 || true
            echo "=== Android AVD files ==="
            find "$HOME/.android/avd" -maxdepth 3 -type f \( -name 'config.ini' -o -name '*.log' \) -print 2>/dev/null || true
            echo "=== Disk and memory ==="
            df -h
            free -h
          } > build/emulator-diagnostics/diagnostics.txt 2>&1

      - name: Upload emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: room-migration-emulator-diagnostics
          path: build/emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 7
