name: Generate Meals soft-3D icons

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-meals-icons.yml"
      - "scripts/generate-meals-icons.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meals-icon-assets
  cancel-in-progress: false

jobs:
  export:
    name: Export shared icon artwork and motion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Export pinned With Icons assets
        run: bash scripts/generate-meals-icons.sh

      - name: Commit generated shared resources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/src/commonMain/composeResources/drawable/meals_icon_*.png
          git add shared/src/commonMain/composeResources/files/meals_*.json
          git add shared/src/commonMain/composeResources/files/WITH_ICONS_MIT_LICENSE.txt
          if git diff --cached --quiet; then
            echo "The generated icon assets are already up to date."
            exit 0
          fi
          git commit -m "Add Meals soft-3D icon assets"
          git pull --rebase origin main
          git push origin HEAD:main
