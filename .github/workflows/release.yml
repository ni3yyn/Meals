name: Signed Android release

# Publish a signed production APK after every update merged or pushed to main.
# The tag is created by this workflow, so tag pushes are deliberately not
# release triggers; this prevents the release from triggering itself again.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 0.2.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: meals-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed minified APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-read-only: false

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.1" "build-tools;36.0.0" "platform-tools"

      - name: Resolve release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            TAG="v$VERSION"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          else
            LATEST_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty' 2>/dev/null || true)"
            if [[ -z "$LATEST_TAG" || "$LATEST_TAG" == "null" ]]; then
              LATEST_TAG="v0.2.0"
            fi

            if [[ "$LATEST_TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              PATCH=$((PATCH + 1))
              VERSION="$MAJOR.$MINOR.$PATCH"
              TAG="v$VERSION"
            else
              echo "::error::Latest stable release tag '$LATEST_TAG' is not MAJOR.MINOR.PATCH."
              exit 1
            fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must use MAJOR.MINOR.PATCH."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 2))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG from commit $GITHUB_SHA"

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meals-release.jks"
          test -s "$RUNNER_TEMP/meals-release.jks"

      - name: Build signed minified APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ steps.release.outputs.version }}
          APP_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          gradle :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease --no-daemon --stacktrace --build-cache --parallel \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION" \
            -PreleaseKeystorePath="$RUNNER_TEMP/meals-release.jks" \
            -PreleaseStorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias="$ANDROID_KEY_ALIAS" \
            -PreleaseKeyPassword="$ANDROID_KEY_PASSWORD"

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/meals.apk

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs dist/meals.apk

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging dist/meals.apk | grep -F "package: name='dz.meals.app'"

          cd dist
          sha256sum meals.apk > SHA256SUMS.txt

      - name: Upload signed APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: meals-signed-apk-v${{ steps.release.outputs.version }}
          path: |
            dist/meals.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      # GitHub's release API currently returns 403 for the repository's
      # workflow token. The signed APK artifact above is the reliable output;
      # keep release publishing as a best-effort convenience, never a build gate.
      - name: Publish signed APK release (best effort)
        id: publish_release
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: مائدتي v${{ steps.release.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false
          files: |
            dist/meals.apk
            dist/SHA256SUMS.txt

      - name: Report artifact fallback when release publishing is blocked
        if: steps.publish_release.outcome == 'failure'
        run: |
          {
            echo "### Signed APK built successfully"
            echo
            echo "GitHub rejected release publishing (403). The signed APK and checksum were already uploaded as workflow artifacts."
            echo "Download the artifact named meals-signed-apk-v${{ steps.release.outputs.version }} from this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/meals-release.jks"
